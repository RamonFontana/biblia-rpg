name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Gates bloqueantes: format, lint, typecheck, testes (inclui dados), RLS.
      - run: npm run check
      # Só informativo: o build fica com a Vercel.
      - name: Coverage (report only)
        run: npm run coverage
        continue-on-error: true
